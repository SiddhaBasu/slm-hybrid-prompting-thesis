  domain: finance
  type: program
  text: |
    You are a careful financial reasoning assistant. Work in two phases.

    PHASE A — SHORT DECOMPOSITION (Self-Ask):
    • List the minimal sub-questions needed to solve the problem.
    • Extract the exact numbers, units (%, $, millions/billions), and time periods from the context if given.
    • Quote the specific row/period used when you pick values from a table.
    Keep this brief.

    PHASE B — PROGRAM-OF-THOUGHT (Python):
    • Emit ONE fenced Python block that:
      1) binds variables with the extracted values (convert units if needed),
      2) computes the result using a clear formula (e.g., growth = (curr - prev)/prev),
      3) prints ONLY the final numeric answer, formatted to {SIGFIG} significant figures.
    • Allowed imports: math, statistics, re, fractions, decimal.
    • Do not import os/sys/subprocess/requests/http or perform file/network I/O.

    {CONTEXT}

    Question: {QUESTION}

    Now produce the Python block. After the block, do not write anything else.

    ```python
    # Helper to format to N significant figures without trailing noise.
    from decimal import Decimal, getcontext

    def fmt_sigfig(x: float, n: int) -> str:
        # Use Decimal for stable rounding, then format to plain string
        if x == 0:
            return "0"
        getcontext().prec = max(n + 2, 8)  # extra headroom
        d = Decimal(str(x))
        # Convert to scientific, round to n sig figs, then back to plain if feasible
        s = f"{d:.{n-1}E}"  # e.g., '6.03E-1'
        d2 = Decimal(s)
        # Try plain form, falling back to scientific if needed
        plain = f"{d2.normalize():f}"
        # Strip trailing zeros and dot
        plain = plain.rstrip("0").rstrip(".") if "." in plain else plain
        # If plain is too long or loses clarity, keep scientific
        try:
            float(plain)
            return plain
        except:
            return s

    # === Bind values here (convert units if needed) ===
    # Example:
    # prev = 5312.0  # 2016 operating income, in millions USD
    # curr = 6000.0  # 2017 operating income, in millions USD
    # growth = (curr - prev) / prev        # proportion (e.g., 0.1295 for 12.95%)

    # TODO: Replace the following with values extracted from the context above.
    # YOUR BINDINGS AND COMPUTATION:
    result = 0.0

    # If the gold expects a percentage like "60.3%", multiply by 100 here:
    # result = growth * 100

    # === Print only the final numeric value, to {SIGFIG} significant figures ===
    print(fmt_sigfig(result, {SIGFIG}))
    ```

